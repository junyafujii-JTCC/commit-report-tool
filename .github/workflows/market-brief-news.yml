# 毎日実行: ニュース JSON + 株価 JSON を更新 → Slack 通知 → コミット
#
# スケジュール: cron 0 22 * * *（UTC 22:00 ＝ 日本時間 翌日 07:00・年中固定）
#
# 株価（market-brief-prices.mjs）:
#   - 取得頻度はこのワークフローに従い毎日
#   - 当日の終値は使わない。PRICE_TO_DATE 未設定時は東京カレンダーの「前日」までが既定（前営業日の終値が最新）
#   - 日本株: Yahoo Finance chart API（API キー不要）／米国: Polygon（要キー）
#
# Secrets:
#   NEWS_API_KEY      … NewsAPI.org（必須）
#   SLACK_WEBHOOK_URL … Slack Incoming Webhook URL（推奨・未設定なら投稿スキップ）
#   POLYGON_API_KEY   … Polygon.io（米国株・任意）
#   SURGE_TOKEN       … surge.sh のトークン（Surge デプロイ用・未設定だとデプロイステップが失敗します）
#
# Variables（任意）:
#   BRIEF_PAGE_URL    … 公開URL（Slack 本文に「詳細」リンク）。例: https://junya-fujii-komineko.surge.sh/market-brief.html
#   PRICE_TO_DATE     … 通常は未設定のまま（当日終値を含めず前日まで）。固定したい日だけ YYYY-MM-DD
#   YAHOO_DELAY_MS    … Yahoo chart 連続リクエスト間隔 ms（任意）
name: Market brief news

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"

permissions:
  contents: write

concurrency:
  group: market-brief-news
  cancel-in-progress: true

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch market brief JSON
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: node docs/fetch-market-news.mjs

      - name: Fetch market prices JSON (Yahoo JP + Polygon US)
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          PRICE_BASE_DATE: ${{ vars.PRICE_BASE_DATE }}
          PRICE_TO_DATE: ${{ vars.PRICE_TO_DATE }}
          YAHOO_DELAY_MS: ${{ vars.YAHOO_DELAY_MS }}
          POLYGON_DELAY_MS: ${{ vars.POLYGON_DELAY_MS }}
        run: node docs/fetch-market-prices.mjs

      - name: Post summary to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BRIEF_PAGE_URL: ${{ vars.BRIEF_PAGE_URL }}
        run: node docs/post-slack-market-brief.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/market-brief-news.json docs/market-brief-prices.json
          if git diff --staged --quiet; then
            echo "No changes to market brief JSON files"
          else
            git commit -m "chore(docs): refresh market brief JSON [skip ci]"
            git push
          fi

      - name: Deploy docs to Surge
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: npx --yes surge@latest ./docs junya-fujii-komineko.surge.sh
